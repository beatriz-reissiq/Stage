<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
    <header>
    
    <nav>
        <div class="container-usuario">
            <div class="container-foto">
                <img src="./assets/img/foto-perfil.png" alt="">
            </div>
            <p class="mensagem">Olá, Beatriz!</p>
            <a href="perfilAdm.html"></a>
            <p class="titulo">Dashboard do Stage Hub</p>
        </div> 

        <div class="logo">
            <img src="./assets/img/logo.png" alt=""> 
        </div>
        
    </nav>
    <nav-left>
        <div class="forms">
          <button onclick="window.location.href='index.html'">
            <img src="./assets/img/home-icon.png" alt="">
          </button>
          <button onclick="window.location.href='dashboard.html'">
            <img src="./assets/img/dashboard-icon.png" alt="">
          </button>
        </div>
    </nav-left>
  </header>

  <main>
<div class="container-conteudo">
    <div class="container-graficos">
        <div class="container-grafico-genero">
            <canvas id="graficoGenero"></canvas>
        </div>
        
        <div class="container-grafico-qtdPosts">
            <canvas id="graficoQtdPosts"></canvas>
        </div>

        <div class="container-grafico-idade">
            <canvas id="graficoIdade"></canvas>
        </div>

        <div class="container-grafico-engajamento">
            <canvas id="graficoEngajamento"></canvas>
        </div>
    </div>

    <div class="container-kpi">
        <div class="KPI">
            <span class="titulo">Total de Usuarios</span>
           <span class="valor" id="kpiUsuarios"></span>
        </div>
        <div class="KPI">
            <span class="titulo">Total de Posts</span>
           <span class="valor" id="kpiPosts"></span>
        </div>
        <div class="KPI">
            <span class="titulo">Total de Curtidas</span>
           <span class="valor" id="kpiCurtidas"></span>
        </div>
    </div>

    
</div>
</main>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./js/dashboard.js"></script>
<script src="./js/graficos.js"></script>

<script>
    window.onload = function () {
    validarDashboard();
}

function validarDashboard() {
    var adm = sessionStorage.ADM;
    if (adm != 1) {
        window.location = "hub.html";
    }
}
</script>
