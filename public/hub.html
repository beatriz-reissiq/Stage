<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/hub.css">
</head>
<body>
    <header>
      <nav-left>
        <div class="forms">

          <div class="link"> 
            <img src="./assets/img/inicial-icon.png" alt=""> 
            <a href="./hubById.html">
              <div class="titulo">Início</div>
            </a>
          </div>

          <div class="link"> 
            <img src="./assets/img/post-icon.png" alt=""> 
            <a href="./hubById.html">
              <div class="titulo">Meus Posts</div>
            </a>
          </div>

          <div class="link"> 
            <img src="./assets/img/popular-icon.png" alt=""> 
              <div class="titulo" onclick="buscarEmAlta()">Em alta</div>
          </div>

          
        
        </div>
    </nav-left>

    <nav>
        <div class="logo"> 
           <a href="./index.html"><img src="./assets/img/logo.png" alt=""></a>
        </div>
        <input type="text" id="ipt_pesquisar" placeholder="🔍︎" oninput="pesquisar()">
        <div class="forms">
            
        </div>
    </nav>
    </header>

    <main>
      <div class="container-feed">
        <div id="feedPosts"></div>
    </div>
      <div class="div_mensagem"></div>
    </main>

</body>
</html>
<script src="./js/hub.js"></script>

<script>
 function pesquisar() {

    let input = ipt_pesquisar.value.toLowerCase();
    let posts = document.getElementsByClassName("cardPost");

    for (let i = 0; i < posts.length; i++) {

        let conteudo = posts[i].innerHTML.toLowerCase();
        if (conteudo.includes(input)) {
            posts[i].style.display = "block";
        } else {
            posts[i].style.display = "none";
            div_mensagem.innerHTML = "Nenhum resultado encontrado :❨"
        }
    }
}

</script>
