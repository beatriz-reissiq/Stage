<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Posts</title>
    <link rel="stylesheet" href="./css/hubById.css">
</head>
<body>
    <header>
      <nav-left>
        <div class="forms">
        
          <div class="link"> 
            <img src="./assets/img/post-icon.png" alt=""> 
            <a href="./hubById.html">
              <div class="titulo">Meus Posts</div>
            </a>
          </div>

           <div class="link"> 
            <img src="./assets/img/inicial-icon.png" alt=""> 
            <a href="./hub.html">
              <div class="titulo">Início</div>
            </a>
          </div>
    </nav-left>

    <nav>
        <div class="logo"> 
           <a href="./index.html"><img src="./assets/img/logo.png" alt=""></a>
        </div>
        <input type="text" id="ipt_pesquisar" placeholder="🔍︎ Buscar nos meus posts" oninput="pesquisar()">
    </nav>
    </header>
    

<main>
    
    <div id="popupPerfil" class="popupPerfil">
        <div class="cardPopup">
            <h2>Complete seu perfil</h2>
            <p>
                Antes de publicar no Stage Hub,
                complete algumas informações sobre você.
            </p>

            <select id="select_genero">
                <option value="">Selecione seu gênero</option>
                <option value="Homem">Homem</option>
                <option value="Mulher">Mulher</option>
                <option value="Outro">Outro / Não me identifico.</option>
            </select>
            <input type="number" id="input_idade" placeholder="Sua idade">
            <button onclick="salvarPerfil()">Salvar Informações</button>
        </div>
    </div>

    <div class="container-main" id="containerPostagem" style="display: none;">
    <div class="container-adicionar" id="areaPostagem" style="display: none;"> 
        <div class="titulo"> ـــﮩ٨ـ Descreva abaixo a sua experiência musical ــ</div>
        <div class="container-texto">
        <div class="subtitulo">Adicione um título para o seu post:</div>
        <input type="text" id="inputTitulo" class="iptTitulo">
        <textarea id="inputDescricao" class="iptComent" placeholder="Digite aqui..."></textarea>
        </div>
        <button onclick="publicar()" class="btnPublicar" id="botaoPublicar">Publicar</button>
    </div>
    </div>
    
    
    <div class="forms"> 
        <button onclick="exibir()" class="btnAdicionar" id="botaoAdicionar">Adicionar Post ↩ </button>
    </div>
    <div id="mensagem_post" class="mensagem_post_class"></div>

    <div id="mensagemNaoEncontrou" class="mensagemNao" style="display: none;">Nenhum resultado encontrado :❨</div>
    
    <div class="container-feed">
        <div id="feedPosts">

        </div>
    </div>
</main>
    

</body>
</html>
<script src="./js/hubById.js"></script>

<script>
   function pesquisar() {

    let input = ipt_pesquisar.value.toLowerCase();
    let posts = document.getElementsByClassName("cardPost");
    let encontrou = false;

    for (let i = 0; i < posts.length; i++) {
        let conteudo = posts[i].innerHTML.toLowerCase();
        if (conteudo.includes(input)) {
            posts[i].style.display = "block";
            encontrou = true;
        } else {
            posts[i].style.display = "none";
        }
    } 
    if (encontrou) {
        document.getElementById("mensagemNaoEncontrou").style.display = "none";
    } else {
        document.getElementById("mensagemNaoEncontrou").style.display = "block";
    }
}
</script>
