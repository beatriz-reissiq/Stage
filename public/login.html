<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

  <main>
    <div class="container-ilustracao">
        <a href="./index.html"><button class="voltar">⟵ Voltar</button></a>
        <div class="fraseEfeito">Seja bem-vindo(a) de volta!</div>
          <div class="subtexto">Preencha as informações nos campos ao lado 
          para acessar o nosso site!</div>
        <img class="ilustracao" src="./assets/img/mulher-cantando.png" alt="">
    </div>

    <div class="container-forms">
        <div class="tituloForms">Faça o seu login</div>
        <input placeholder="Email" type="text" id="ipt_email"> <br>
        <input placeholder="Senha" type="password" id="ipt_senha" > <br>

        <button onclick="autenticar()">Login</button>
        <small>Ainda não tem um cadastro? <a href="./cadastro.html">Cadastre-se</small> </a>
       <div class="pop-up" id="popLogin"></div>
    </div>
  </main>
</body>
</html>
<script src="./js/login.js"></script>
